# ╔══════════════════════════════════════════════════════╗
# ║    AutoAgent v5.0 — Config (Qwen 2.5 on Apple M4)   ║
# ╚══════════════════════════════════════════════════════╝

# ── Model ──────────────────────────────────────────────
model: qwen2.5-coder:7b       # switch to :14b if you have the RAM
context_size: 16384
temperature: 0.0
ollama_url: http://localhost:11434
llm_retries: 3
retry_delay: 2

# ── Timeouts ───────────────────────────────────────────
python_timeout: 30
command_timeout: 30
web_timeout: 15
intent_timeout: 8
grammar_repair_timeout: 45

# ── Paths ──────────────────────────────────────────────
workspace_dir: workspace
plugins_dir: plugins

# ── UX & Intent ─────────────────────────────────────────
enable_streaming: true
enable_intent_gating: true
intent_use_grammar: true

# ── Planning ───────────────────────────────────────────
enable_planning: true
planning_threshold: 50

# ── Grammar Guardrails ──────────────────────────────────
enable_grammar_repair: true

# ── Parallel Execution ──────────────────────────────────
enable_parallel_tools: true
max_parallel_workers: 4

# ── Context — tuned for 7B/9B small models ─────────────
# Small models lose coherence quickly with long histories.
# Compress earlier and keep fewer recent messages.
compress_threshold: 20
keep_recent: 8               # fewer recent messages = less noise
enable_smart_compress: true

# ── Search & Deep Research ──────────────────────────────
search_max_results: 5        # fewer results = less token noise
search_engine: auto           # auto (ddgs -> ddg_html -> tavily/brave)
deep_research_max_queries: 4  # sub-queries per research run
deep_research_max_pages: 5    # max pages to scrape concurrently via Trafilatura
enable_diagnostic_research: true # auto-research on system/tool errors
tavily_api_key: ""            # optional: Tavily API key
brave_api_key: ""             # optional: Brave Search API key
file_read_limit: 6000        # generous but not overwhelming
url_read_limit: 5000         # clean Trafilatura markdown limit

# ── Observation offloading ─────────────────────────────
# Large tool outputs are saved to workspace/ and a short pointer
# is given to the model instead. Keeps context clean.
observation_limit: 3000      # chars fed back to LLM
offload_large_obs: true      # enable file-based offloading

# ── Safety ─────────────────────────────────────────────
max_steps: 30                # hard cap on ReAct steps per task
max_json_retries: 3
max_repeat_count: 2

# ── Persistence ────────────────────────────────────────
memory_file: agent_memory.json
episodic_file: agent_episodic.json
session_file: agent_session.json
session_keep_messages: 40
log_file: agent.log

